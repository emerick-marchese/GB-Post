<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>GB Post</title>
  <link rel="stylesheet" href="note.css">
</head>
<body>
  <header class="bar">
    <button id="btn-app" class="logo-btn" title="Ouvrir GB Post"><img class="logo" src="../assets/icon.png" alt="GB Post"></button>
    <div class="tools">
      <button id="btn-new" title="Nouveau post-it (Ctrl+N)">＋</button>
      <div class="spacer"></div>
      <button id="btn-color" title="Changer la couleur">🎨</button>
      <button id="btn-pin" title="Épingler sur le bureau">📌</button>
      <button id="btn-hide" title="Masquer du bureau (reste dans GB Post)">－</button>
      <button id="btn-delete" title="Supprimer le post-it">✕</button>
    </div>
    <button id="btn-edit" class="edit" title="Modifier">✏️</button>
  </header>

  <div id="palette" class="palette" hidden>
    <div id="swatches" class="swatches"></div>
    <label class="custom" title="Couleur personnalisée">
      Autre… <input id="custom-color" type="color">
    </label>
  </div>

  <div id="format-bar" class="format-bar">
    <button data-cmd="bold" title="Gras (Ctrl+B)"><b>G</b></button>
    <button data-cmd="italic" title="Italique (Ctrl+I)"><i>I</i></button>
    <button data-cmd="underline" title="Souligné (Ctrl+U)"><u>S</u></button>
    <span class="sep"></span>
    <button data-align="left" title="Aligner à gauche"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="1" y="6" width="9" height="2" rx="1"/><rect x="1" y="10" width="14" height="2" rx="1"/><rect x="1" y="14" width="9" height="2" rx="1"/></svg></button>
    <button data-align="center" title="Centrer"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="3.5" y="6" width="9" height="2" rx="1"/><rect x="1" y="10" width="14" height="2" rx="1"/><rect x="3.5" y="14" width="9" height="2" rx="1"/></svg></button>
    <button data-align="right" title="Aligner à droite"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="6" y="6" width="9" height="2" rx="1"/><rect x="1" y="10" width="14" height="2" rx="1"/><rect x="6" y="14" width="9" height="2" rx="1"/></svg></button>
  </div>

  <main id="content" class="content">
    <input id="title" class="title" type="text" maxlength="200" placeholder="Titre" spellcheck="true">
    <div id="blocks" class="blocks"></div>
    <div class="add-row">
      <button id="btn-add-text" title="Ajouter un paragraphe (Ctrl+T)">＋ Texte</button>
      <button id="btn-add-check" title="Ajouter une case à cocher (Ctrl+L)">＋ Case à cocher</button>
    </div>
  </main>

  <div id="grip" class="grip" title="Glisser pour redimensionner"></div>
  <footer class="status"><span id="progress"></span><span id="saved">Enregistré ✓</span></footer>

  <script src="rich.js"></script>
  <script src="note.js"></script>
</body>
</html>
