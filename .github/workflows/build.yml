name: Installateur Windows

# À chaque mise à jour du code : nouvelle version numérotée (1.1.<n°>),
# construite sur Windows et publiée dans les Releases GitHub. Les copies de
# GB Post déjà installées la détectent et se mettent à jour toutes seules.

on:
  push:
    branches: [claude/gb-post-app-fxfuqe, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Numéro de version
        shell: bash
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version

      - name: Construire et publier la version
        run: npx electron-builder --win nsis --x64 --publish always

      - uses: actions/upload-artifact@v4
        with:
          name: GB-Post-Setup
          path: dist/*.exe

      # L'ancienne release sans numéro de version n'est plus utilisée.
      - name: Nettoyer l'ancienne release
        shell: bash
        continue-on-error: true
        run: gh release delete gb-post-latest --cleanup-tag --yes --repo "${{ github.repository }}"
