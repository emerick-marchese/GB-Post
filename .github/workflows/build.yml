name: Installateur Windows

# À chaque mise à jour du code : nouvelle version numérotée (1.1.<n°>),
# construite sur Windows et publiée dans les Releases GitHub. Les copies de
# GB Post déjà installées la détectent et se mettent à jour toutes seules.

on:
  push:
    branches: [claude/gb-post-app-fxfuqe, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Numéro de version
        shell: bash
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version

      - name: Construire l'installateur
        run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: GB-Post-Setup
          path: dist/*.exe

      # Release versionnée avec latest.yml : c'est elle que lisent les copies
      # installées pour se mettre à jour.
      - name: Publier la release
        shell: bash
        run: |
          VERSION="1.1.${{ github.run_number }}"
          gh release create "v$VERSION" \
            dist/GB-Post-Setup.exe dist/GB-Post-Setup.exe.blockmap dist/latest.yml \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "GB Post $VERSION" \
            --notes "Télécharge **GB-Post-Setup.exe** ci-dessous et lance-le. Si GB Post est déjà installé, il est simplement mis à jour (tes post-its et rappels sont conservés). Les versions installées se mettent aussi à jour toutes seules." \
            --latest

      # Anciennes releases inutilisables : la release sans numéro de version et
      # la v1.1.4 dont la publication a échoué à moitié.
      - name: Nettoyer les anciennes releases
        shell: bash
        continue-on-error: true
        run: |
          for tag in gb-post-latest v1.1.4; do
            gh release delete "$tag" --cleanup-tag --yes --repo "${{ github.repository }}" || true
          done
